<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基于对比学习的不当言论检测系统</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background-color: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; resize: none; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px; transition: background-color 0.3s; }
        button:hover { background-color: #0056b3; }
        #result-box { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; text-align: center; font-size: 18px; font-weight: bold; }
        .safe { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .toxic { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .confidence { font-size: 14px; font-weight: normal; margin-top: 5px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>不当言论检测系统</h2>
    <textarea id="inputText" placeholder="请输入需要检测的文本... (例如：你这人真是个白痴)"></textarea>
    <button onclick="checkText()">开始检测</button>

    <div id="result-box">
        <span id="result-label"></span>
        <div id="result-conf" class="confidence"></div>
    </div>
</div>

<script>
    async function checkText() {
        const text = document.getElementById('inputText').value;
        const resultBox = document.getElementById('result-box');
        const resultLabel = document.getElementById('result-label');
        const resultConf = document.getElementById('result-conf');

        if (!text.trim()) {
            alert("请输入内容！");
            return;
        }

        // 显示正在检测...
        resultBox.style.display = 'block';
        resultBox.className = '';
        resultLabel.innerText = '正在使用 BERT 检测中...';
        resultConf.innerText = '';

        try {
            // 发送请求给后端的 Flask API
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            const data = await response.json();

            if (data.error) {
                resultLabel.innerText = '错误: ' + data.error;
                return;
            }

            // 更新 UI 结果
            resultLabel.innerText = data.label_name;
            resultConf.innerText = 'AI 确信度: ' + data.confidence;

            if (data.label === 1) {
                resultBox.className = 'toxic';
            } else {
                resultBox.className = 'safe';
            }
        } catch (error) {
            resultLabel.innerText = '网络请求失败，请检查后端是否启动。';
        }
    }
</script>

</body>
</html>
